name: Frontend CI

on:
  push:
    branches: [main]
    paths: ['smartRE-front/**']
  pull_request:
    branches: [main]
    paths: ['smartRE-front/**']

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smartRE-front
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: smartRE-front/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
