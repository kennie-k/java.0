spring:
  application:
    name: verification-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://verification-db:5432/verification_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:bantu007#}
    driverClassName: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
    consumer:
      group-id: ${spring.application.name}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: "com.kenyarealestate.*"

server:
  port: 8082

jwt:
  secret: ${JWT_SECRET}

services:
  property-url: ${PROPERTY_SERVICE_URL:http://property-service:8083}
  internal-secret: ${INTERNAL_SECRET}
  document-analysis-enabled: ${DOCUMENT_ANALYSIS_ENABLED:false}
  document-analysis-url: ${DOCUMENT_ANALYSIS_URL:https://api.yourdocumentai.com}
  document-analysis-key: ${DOCUMENT_ANALYSIS_KEY:placeholder}
  smile-identity-enabled: ${SMILE_IDENTITY_ENABLED:false}
  smile-identity-url: ${SMILE_IDENTITY_URL:https://testapi.smileidentity.com/v1}
  smile-identity-partner-id: ${SMILE_IDENTITY_PARTNER_ID:placeholder}
  smile-identity-api-key: ${SMILE_IDENTITY_API_KEY:placeholder}
  ardhisasa-enabled: ${ARDHISASA_ENABLED:false}
  ardhisasa-url: ${ARDHISASA_URL:https://api.ardhisasa.go.ke}
  ardhisasa-api-key: ${ARDHISASA_API_KEY:placeholder}

gateway:
  signing-secret: ${GATEWAY_SIGNING_SECRET}

verification:
  identity-expiry-years: 2
  max-fraud-strikes: 3
  fraud-cooldown-days: 90
  identity-auto-approve-score: 85
  biometric-hard-block: ${BIOMETRIC_HARD_BLOCK:true}

redis:
  trust-status-ttl-seconds: 300
  trust-status-prefix: "trust:"

kafka:
  topics:
    verification-events: verification-events

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    export:
      prometheus:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

resilience4j:
  circuitbreaker:
    instances:
      property-service:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 10s
        failureRateThreshold: 50